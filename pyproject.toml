[project]
name = "dreeve-zepp-connector"
version = "0.1.0"
description = "Pulls workouts from Zepp/Amazfit and drops them as .FIT files into Dreeve's watch folder"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fit-tool>=0.9.13",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
dreeve-zepp-connector = "dreeve_zepp_connector.main:run"
dreeve-zepp-connector-loop = "dreeve_zepp_connector.loop:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dreeve_zepp_connector"]
